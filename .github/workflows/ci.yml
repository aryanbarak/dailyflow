name: CI

on:
  pull_request: {}
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          # CI-02: without this, the npm cache key covers only the root
          # package-lock.json -- agent/worker's own `npm ci` below
          # (wrangler/workerd, the heaviest downloads in the job) never hit
          # the cache and were observed taking 6-7 minutes on registry-slow
          # runners. This keys the cache on every lockfile in the repo.
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      # TC-01: agent/worker is a separate deployable unit with its own
      # package.json/package-lock.json (@cloudflare/workers-types,
      # typescript, wrangler -- not an npm workspace of the root project,
      # so root's `npm ci` above never installs these). The extended
      # typecheck gate (scripts/typecheck-gate.mjs) needs
      # agent/worker/node_modules/typescript/bin/tsc to exist to run its
      # agent/worker/ target at all.
      - name: Install agent/worker dependencies
        working-directory: agent/worker
        run: npm ci

      # ENG-04: agent/companion's real-git integration tests (taskRunner.test.js,
      # poller.test.js) run actual `git commit` against isolated local fixture
      # repos. A fresh runner has no global git identity, so those commits fail
      # with "Author identity unknown" -- this is CI-environment setup, not a
      # companion source/test change.
      - name: Configure git identity for companion test fixtures
        run: |
          git config --global user.email "ci@smartflow.local"
          git config --global user.name "CI Runner"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # LINT-01 TODO: this repo has 41 pre-existing lint errors
      # (docs/architecture/notes/ or the CI-00 report has the count) --
      # continue-on-error here so CI-01 doesn't block every PR on
      # unrelated pre-existing violations. A future task (LINT-01) is
      # expected to either fix them or adopt an eslint baseline mechanism,
      # then remove this continue-on-error so lint becomes blocking.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # No VITE_* secrets passed here on purpose: `npm run build` was
      # verified locally (CI-01) to succeed with zero VITE_* env vars set
      # -- Vite does not fail the build when an import.meta.env.VITE_*
      # reference is undefined, it just bundles `undefined` for that
      # reference and the app's own runtime code handles an unconfigured
      # value (this workflow never serves or deploys the resulting dist/,
      # so a build-time-unconfigured value has no user-facing effect here
      # either way). If a future change makes the build actually REQUIRE
      # one of these to succeed, use the same secrets
      # deploy-cloudflare-pages.yml already defines
      # (VITE_TUTOR_API_URL, VITE_TUTOR_API_TOKEN, VITE_AI_AGENT_URL,
      # VITE_APP_ENV, VITE_AGENT_WORKER_URL) rather than inventing new ones.
      - name: Build
        run: npm run build
