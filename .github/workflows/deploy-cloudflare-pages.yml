name: Deploy SmartFlow to Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch: {}

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # HOTFIX-01: TC-01 added this same step to ci.yml only -- this
      # workflow's own typecheck step calls the same two-target gate
      # (npm run typecheck -> scripts/typecheck-gate.mjs), whose
      # agent/worker/ target needs agent/worker/node_modules/typescript/
      # bin/tsc to exist. Root's `npm ci` above never installs it (agent/
      # worker is a separate deployable unit, not an npm workspace -- see
      # ci.yml's own comment on its equivalent step).
      - name: Install agent/worker dependencies
        working-directory: agent/worker
        run: npm ci

      # ENG-04-fix: this same step was added to ci.yml only (see its
      # equivalent comment) -- this workflow runs its own separate `npm
      # test` on its own job/runner, so it needs the identical git identity
      # or agent/companion's real-git integration tests (taskRunner.test.js,
      # poller.test.js) fail here too with "Author identity unknown", even
      # though ci.yml already passed on the same commit. This is the same
      # drift pattern HOTFIX-01 already hit once for the typecheck step
      # above -- worth deduplicating these two workflows' shared setup if
      # it recurs a third time.
      - name: Configure git identity for companion test fixtures
        run: |
          git config --global user.email "ci@smartflow.local"
          git config --global user.name "CI Runner"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_TUTOR_API_URL: ${{ secrets.VITE_TUTOR_API_URL }}
          VITE_TUTOR_API_TOKEN: ${{ secrets.VITE_TUTOR_API_TOKEN }}
          VITE_AI_AGENT_URL: ${{ secrets.VITE_AI_AGENT_URL }}
          VITE_APP_ENV: ${{ secrets.VITE_APP_ENV }}
          VITE_AGENT_WORKER_URL: ${{ secrets.VITE_AGENT_WORKER_URL }}
        run: npm run build

      - name: Verify dist
        run: test -f dist/index.html

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch main
