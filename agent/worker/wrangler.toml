name = "dailyflow-agent-worker"
main = "index.ts"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 6 * * *"]  # هر روز ساعت ۶ UTC = ۸ صبح آلمان

# ADR-0018 S1b: makes env.AI (Env.AI: Ai, agent/worker/types.ts) a real
# binding at runtime -- the type existed before this binding did (see
# PROJECT_STATUS.md's S1b entry), so env.AI was `undefined` at runtime
# despite being typed as required until this line was added.
[ai]
binding = "AI"

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
SUPABASE_URL = "https://taqxwnlwllbywaklwyno.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhcXh3bmx3bGxieXdha2x3eW5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4ODQzNjEsImV4cCI6MjA5MzQ2MDM2MX0.TmhuyWcwEUwnSvxXJiZ2HueY6Jr0sudmyJWlpM-X7_Y"
# ADR-0018 S1b: 'gemini' (default) | 'workers-ai' -- selects the
# TextGenerationProvider createProviders() constructs for this deployment.
# See providers/workers-ai/WorkersAITextGenerationProvider.ts's header
# comment for the model choice/rationale, and createProviders.ts for the
# selection logic. Structured generation and embeddings are unaffected
# (ADR-0018 Decision 5: Gemini-only, fail-closed, regardless of this var).
# 2026-09: back to 'gemini' -- the workers-ai flip put Gemma in front of
# every legacy chat turn against provider-contract-smoke's committed
# default, and production showed both Gemma and the Gemini fallback
# failing (PROVIDER_UNAVAILABLE_CHAT) plus Gemma's literal-instruction
# language refusals (LANG-01). Workers AI remains available as the
# FALLBACK via AI_TEXT_FALLBACK below.
AI_TEXT_PROVIDER = "gemini"
# ADR-0018 S1c: 'on' | absent/anything else (default off). 'on' wraps the
# AI_TEXT_PROVIDER-selected TextGenerationProvider as the PRIMARY of a
# fallback chain, with the other text provider as secondary -- one
# fallback attempt on ProviderUnavailableError only (network/429/5xx; a
# model that answers badly is never a trigger), then an honest 503
# PROVIDER_UNAVAILABLE if the secondary also fails. Applies ONLY to
# TextGenerationProvider consumers without an attachment -- attachment
# call sites (transcribePdf, /documents/analyze, /chat image attachments)
# stay pinned to Gemini via pinTextProvider and never see this wrapper.
# Structured generation and embeddings are unaffected (Decision 5:
# fail-closed, no fallback, regardless of this var). See
# providers/fallbackTextProvider.ts and createProviders.ts for the
# implementation.
AI_TEXT_FALLBACK = "on"

# Secrets — با wrangler secret put تنظیم کن:
# wrangler secret put SUPABASE_SERVICE_KEY
# wrangler secret put GEMINI_API_KEY
# ALF-1A production observation only.
AI_LEARNING_CAPTURE_ENABLED = "true"

# Shadow remains explicitly disabled until ALF-1B review.
AI_SHADOW_ENABLED = "false"