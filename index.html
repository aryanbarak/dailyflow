<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smartFlow - Intelligent Productivity</title>
    <meta name="description" content="smartFlow — your intelligent productivity platform to organize daily tasks, finances, calendar and family in one place." />
    <meta name="author" content="smartFlow" />

    <!-- No-cache for HTML shell so SW always gets fresh JS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <!-- PWA -->
    <meta name="theme-color" content="#03040F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartFlow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/pwa-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- DESIGN-AUDIT 0.6 (light mode): apply the stored theme BEFORE first
         paint -- reads the same smartflow_preferences key usePreferences
         owns; any failure keeps the markup's dark default. Must run before
         the <style> below paints anything. -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("smartflow_preferences") || "{}");
          var theme = stored.theme || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* keep the dark default */
        }
      })();
    </script>
    <style>
      /* Pre-hydration paint only -- the CSS bundle (index.css) takes over
         with --flow-bg-deep + --flow-gradient-background once loaded
         (DESIGN-AUDIT 0.4). #03040F IS --flow-bg-deep's value; a raw hex
         is unavoidable here because the token file ships inside the CSS
         bundle and does not exist yet at first paint. DESIGN-AUDIT 0.6:
         the boot background is class-driven now -- the script above has
         already resolved .dark before this paints, and the light value
         mirrors index.css's light --background. #root must stay
         transparent so it never occludes the body gradient. */
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #03040F;
      }

      html:not(.dark),
      html:not(.dark) body {
        background: #f7f8fb;
      }

      #root {
        min-height: 100%;
        margin: 0;
        background: transparent;
      }

      body {
        overflow-x: hidden;
      }
    </style>

    <meta property="og:title" content="smartFlow - Intelligent Productivity" />
    <meta property="og:description" content="smartFlow — your intelligent productivity platform to organize daily tasks, finances, calendar and family in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
